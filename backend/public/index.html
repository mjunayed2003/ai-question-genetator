<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Question Generator API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2.5rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #064e3b;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .endpoints {
      margin-top: 1.5rem;
      text-align: left;
      background: #0f172a;
      border-radius: 0.5rem;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .endpoints a {
      color: #38bdf8;
      text-decoration: none;
    }
    .endpoints a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Online</div>
    <h1>AI Question Generator API</h1>
    <p>NestJS Backend is running on Vercel Serverless.</p>
    <div class="endpoints">
      <div><strong>Status:</strong> <a href="/health">/health</a></div>
      <div><strong>Base API:</strong> <a href="/api">/api</a></div>
      <div><strong>Question Sets:</strong> <a href="/questions/sets">/questions/sets</a></div>
    </div>
  </div>
</body>
</html>
